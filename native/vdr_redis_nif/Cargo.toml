[package]
name = "vdr_redis_nif"
version = "0.1.0"
edition = "2021"

[lib]
name = "vdr_redis_nif"
crate-type = ["cdylib"]

[dependencies]
rustler = "0.37.2"
libc = "0.2"
bytes = "1.5"
log = "0.4"
env_logger = "0.11"

[build-dependencies]
cc = "1.0"

[profile.release]
debug = 2
force-frame-pointers = true
strip = false
lto = false
codegen-units = 1
opt-level = 2

[profile.release.package."*"]
debug = 2
force-frame-pointers = true
opt-level = 2
