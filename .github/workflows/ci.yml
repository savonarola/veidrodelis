name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      MIX_ENV: test

    steps:
      - uses: actions/checkout@v4

      - name: Setup Elixir
        uses: erlef/setup-elixir@v1
        with:
          elixir-version: '1.19'
          otp-version: '28'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Install cargo-llvm-cov
        run: |
          rustup component add llvm-tools-preview
          cargo install cargo-llvm-cov

      - name: Install just
        uses: extractions/setup-just@v2

      - name: Get dependencies
        run: mix deps.get

      - name: Start test services
        run: |
          just dc-start
          just dc-sentinel-start

      - name: Run coverage
        run: just cov

      - name: Run Rust clippy (NIFs)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Upload coverage to Coveralls (Elixir)
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path-to-lcov: cover/elixir/lcov.info
          format: lcov
          flag-name: elixir
          parallel: true

      - name: Upload coverage to Coveralls (NIF)
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path-to-lcov: cover/nif/lcov.info
          format: lcov
          flag-name: nif
          parallel: true

      - name: Finalize Coveralls
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          parallel-finished: true



      - name: Stop test services
        if: always()
        run: |
          just dc-stop
          just dc-sentinel-stop
