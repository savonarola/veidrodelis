services:
  valkey-9:
    image: valkey/valkey:9-alpine
    container_name: veidrodelis-valkey-9
    ports:
      - "16378:6379"
    command: >
      valkey-server
      --repl-diskless-sync yes
      --save 60 1
      --loglevel debug
    networks:
      veidrodelis-net:
        ipv4_address: 172.28.0.10      

  redis-7.2:
    image: redis:7.2-alpine
    container_name: veidrodelis-redis-7.2
    ports:
      - "26378:6379"
    command: >
      redis-server
      --repl-diskless-sync yes
      --save 60 1
      --loglevel debug
    networks:
      veidrodelis-net:
        ipv4_address: 172.28.0.11  

  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.9.0
    container_name: veidrodelis-toxiproxy
    ports:
      - "16379:16379"  # Redis proxy port
      - "8474:8474"     # Toxiproxy management API
    networks:
      veidrodelis-net:
        ipv4_address: 172.28.0.12
    volumes:
      - ./toxiproxy.json:/toxiproxy.json:ro
    command: ["-host=0.0.0.0", "-config=/toxiproxy.json"]

  valkey-with-password:
    image: valkey/valkey:9-alpine
    container_name: veidrodelis-valkey-password
    ports:
      - "16380:6379"
    command: >
      valkey-server
      --requirepass testpassword
      --repl-diskless-sync yes
      --save 60 1
      --loglevel verbose
    networks:
      veidrodelis-net:
        ipv4_address: 172.28.0.13

  redis-with-acl:
    image: valkey/valkey:9-alpine
    container_name: veidrodelis-valkey-acl
    ports:
      - "16381:6379"
    command: >
      valkey-server
      --repl-diskless-sync yes
      --save 60 1
      --loglevel verbose
      --aclfile /usr/local/etc/valkey/users.acl
    volumes:
      - ./users.acl:/usr/local/etc/valkey/users.acl:ro
    networks:
      veidrodelis-net:
        ipv4_address: 172.28.0.14

  valkey-ssl:
    image: valkey/valkey:9-alpine
    container_name: veidrodelis-valkey-ssl
    ports:
      - "16382:6379"
    command: >
      valkey-server
      --tls-port 6379
      --port 0
      --tls-cert-file /tls/server-cert.pem
      --tls-key-file /tls/server-key.pem
      --tls-ca-cert-file /tls/ca-cert.pem
      --tls-auth-clients no
      --repl-diskless-sync yes
      --save 60 1
      --loglevel verbose
    volumes:
      - ./ssl:/tls:ro
    networks:
      veidrodelis-net:
        ipv4_address: 172.28.0.15

  # Sentinel setup for high availability testing
  redis-sentinel-primary:
    image: redis:7.2-alpine
    container_name: veidrodelis-sentinel-primary
    ports:
      - "16390:16390"
    command: >
      redis-server
      --port 16390
      --repl-diskless-sync yes
      --save ""
      --loglevel debug
    networks:
      veidrodelis-net:
        ipv4_address: 172.28.0.20

  redis-sentinel-replica:
    image: redis:7.2-alpine
    container_name: veidrodelis-sentinel-replica
    ports:
      - "16391:16391"
    command: >
      redis-server
      --port 16391
      --replicaof 172.28.0.20 16390
      --repl-diskless-sync yes
      --save ""
      --loglevel debug
    depends_on:
      - redis-sentinel-primary
    networks:
      veidrodelis-net:
        ipv4_address: 172.28.0.21

  redis-sentinel-1:
    image: redis:7.2-alpine
    container_name: veidrodelis-sentinel-1
    ports:
      - "27379:27379"
    command: >
      sh -c "
      until ping -c1 redis-sentinel-primary >/dev/null 2>&1; do
        echo 'Waiting for redis-sentinel-primary...';
        sleep 1;
      done;
      sleep 2;
      cp /etc/redis/sentinel.conf /tmp/sentinel.conf &&
      echo 'port 27379' >> /tmp/sentinel.conf &&
      echo 'sentinel announce-ip 172.28.0.31' >> /tmp/sentinel.conf &&
      echo 'sentinel announce-port 27379' >> /tmp/sentinel.conf &&
      redis-sentinel /tmp/sentinel.conf"
    volumes:
      - ./sentinel.conf:/etc/redis/sentinel.conf:ro
    depends_on:
      - redis-sentinel-primary
      - redis-sentinel-replica
    networks:
      veidrodelis-net:
        ipv4_address: 172.28.0.31

  redis-sentinel-2:
    image: redis:7.2-alpine
    container_name: veidrodelis-sentinel-2
    ports:
      - "27380:27380"
    command: >
      sh -c "
      until ping -c1 redis-sentinel-primary >/dev/null 2>&1; do
        echo 'Waiting for redis-sentinel-primary...';
        sleep 1;
      done;
      sleep 2;
      cp /etc/redis/sentinel.conf /tmp/sentinel.conf &&
      echo 'port 27380' >> /tmp/sentinel.conf &&
      echo 'sentinel announce-ip 172.28.0.32' >> /tmp/sentinel.conf &&
      echo 'sentinel announce-port 27380' >> /tmp/sentinel.conf &&
      redis-sentinel /tmp/sentinel.conf"
    volumes:
      - ./sentinel.conf:/etc/redis/sentinel.conf:ro
    depends_on:
      - redis-sentinel-primary
      - redis-sentinel-replica
    networks:
      veidrodelis-net:
        ipv4_address: 172.28.0.32

  redis-sentinel-3:
    image: redis:7.2-alpine
    container_name: veidrodelis-sentinel-3
    ports:
      - "27381:27381"
    command: >
      sh -c "
      until ping -c1 redis-sentinel-primary >/dev/null 2>&1; do
        echo 'Waiting for redis-sentinel-primary...';
        sleep 1;
      done;
      sleep 2;
      cp /etc/redis/sentinel.conf /tmp/sentinel.conf &&
      echo 'port 27381' >> /tmp/sentinel.conf &&
      echo 'sentinel announce-ip 172.28.0.33' >> /tmp/sentinel.conf &&
      echo 'sentinel announce-port 27381' >> /tmp/sentinel.conf &&
      redis-sentinel /tmp/sentinel.conf"
    volumes:
      - ./sentinel.conf:/etc/redis/sentinel.conf:ro
    depends_on:
      - redis-sentinel-primary
      - redis-sentinel-replica
    networks:
      veidrodelis-net:
        ipv4_address: 172.28.0.33

networks:
  veidrodelis-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
          gateway: 172.28.0.1

volumes:
  redis-data:
