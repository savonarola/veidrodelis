services:
  valkey-9:
    image: valkey/valkey:9-alpine
    container_name: veidrodelis-valkey-9
    ports:
      - "16378:6379"
    command: >
      valkey-server
      --repl-diskless-sync yes
      --save 60 1
      --loglevel debug
    networks:
      veidrodelis-net:
        ipv4_address: 172.28.0.10      

  redis-7.2:
    image: redis:7.2-alpine
    container_name: veidrodelis-redis-7.2
    ports:
      - "26378:6379"
    command: >
      redis-server
      --repl-diskless-sync yes
      --save 60 1
      --loglevel debug
    networks:
      veidrodelis-net:
        ipv4_address: 172.28.0.11  

  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.9.0
    container_name: veidrodelis-toxiproxy
    ports:
      - "16379:16379"  # Redis proxy port
      - "8474:8474"     # Toxiproxy management API
    networks:
      veidrodelis-net:
        ipv4_address: 172.28.0.12
    volumes:
      - ./toxiproxy.json:/toxiproxy.json:ro
    command: ["-host=0.0.0.0", "-config=/toxiproxy.json"]

  valkey-with-password:
    image: valkey/valkey:9-alpine
    container_name: veidrodelis-valkey-password
    ports:
      - "16380:6379"
    command: >
      valkey-server
      --requirepass testpassword
      --repl-diskless-sync yes
      --save 60 1
      --loglevel verbose
    networks:
      veidrodelis-net:
        ipv4_address: 172.28.0.13

  redis-with-acl:
    image: valkey/valkey:9-alpine
    container_name: veidrodelis-valkey-acl
    ports:
      - "16381:6379"
    command: >
      valkey-server
      --repl-diskless-sync yes
      --save 60 1
      --loglevel verbose
      --aclfile /usr/local/etc/valkey/users.acl
    volumes:
      - ./users.acl:/usr/local/etc/valkey/users.acl:ro
    networks:
      veidrodelis-net:
        ipv4_address: 172.28.0.14

  valkey-ssl:
    image: valkey/valkey:9-alpine
    container_name: veidrodelis-valkey-ssl
    ports:
      - "16382:6379"
    command: >
      valkey-server
      --tls-port 6379
      --port 0
      --tls-cert-file /tls/server-cert.pem
      --tls-key-file /tls/server-key.pem
      --tls-ca-cert-file /tls/ca-cert.pem
      --tls-auth-clients no
      --repl-diskless-sync yes
      --save 60 1
      --loglevel verbose
    volumes:
      - ./ssl:/tls:ro
    networks:
      veidrodelis-net:
        ipv4_address: 172.28.0.15

networks:
  veidrodelis-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
          gateway: 172.28.0.1

volumes:
  redis-data:
