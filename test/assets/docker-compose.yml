version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: veidrodelis-redis
    ports:
      - "6379:6379"
    command: >
      redis-server
      --repl-diskless-sync yes
      --save 60 1
      --loglevel verbose
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  redis-data:
